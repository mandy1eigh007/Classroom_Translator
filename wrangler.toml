# ClassLingo — Cloudflare Pages configuration
#
# SETUP (one-time, in the Cloudflare dashboard):
#
# 1. KV namespaces (already created; ids below are live):
#        - "classlingo-session"     (live class state, messages, translations)
#        - "classlingo-phrasebook"  (student phrasebook sync)
#
# 2. Set environment variables (Pages project -> Settings -> Environment
#    variables, Production AND Preview) — full details in /public/SETUP.md:
#        OPENAI_API_KEY             - OpenAI API key (translation, notes, TTS,
#                                     Whisper, OCR)
#        TEACHER_PASSWORD           - instructor login password
#        SUPABASE_URL               - https://lfizcpaqolckemrvsooy.supabase.co
#        SUPABASE_ANON_KEY          - anon key (Supabase -> Settings -> API)
#        SUPABASE_SERVICE_ROLE_KEY  - service_role key (KEEP SECRET; server-
#                                     side auth verification follow-up)
#      optional:
#        MYMEMORY_EMAIL    - contact email for the MyMemory free translation
#                            fallback (bumps the free quota from 10k to 50k
#                            chars/day). Leave unset to skip.
#
# 3. If you created the Pages project from the dashboard instead of
#    `wrangler pages deploy`, also bind the KV namespaces there:
#    Pages project -> Settings -> Bindings -> Add -> KV namespace
#        binding name SESSION_KV     -> classlingo-session
#        binding name PHRASEBOOK_KV  -> classlingo-phrasebook

name = "classroom-translator"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "3b3706c8f3114a91a887186cb34db1c7"

[[kv_namespaces]]
binding = "PHRASEBOOK_KV"
id = "6668697d2717492ea1c7fdc4a78ba0cf"
