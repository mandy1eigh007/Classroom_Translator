<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - ClassLingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/supabase-config.js"></script>
  <style>
    :root {
      --canvas:#06131d; --deep:#020a11; --text:#f5f7f4; --muted:rgba(220,249,250,.72);
      --cyan:#13d6d1; --yellow:#c6ee35; --orange:#fb694a;
    }
    * { box-sizing:border-box; }
    html, body { min-height:100%; margin:0; }
    body {
      position:relative; display:grid; place-items:center; padding:46px 18px;
      color:var(--text); font-family:Inter,Arial,sans-serif;
      background-color:var(--canvas);
      background-image:linear-gradient(180deg,rgba(2,12,23,.58),rgba(2,11,21,.84)),url("/assets/teacher-blueprint-bg.jpg");
      background-size:100% 100%,cover; background-position:center top;
    }
    body::before {
      content:""; position:absolute; top:18px; left:18px; right:18px; height:5px;
      background:linear-gradient(90deg,var(--cyan),var(--yellow));
      box-shadow:0 0 11px rgba(0,211,237,.42);
    }
    .reset-card {
      position:relative; overflow:hidden; width:min(100%,430px); padding:26px;
      background:linear-gradient(to left,rgba(27,61,84,.84),rgba(7,23,38,.93) 58%,rgba(3,13,24,.97));
      border:1px solid rgba(128,232,246,.88); border-radius:3px;
      box-shadow:0 4px 0 var(--deep),0 9px 16px rgba(0,0,0,.46),0 0 14px rgba(0,210,236,.14),inset 0 1px 0 rgba(185,251,255,.32);
      backdrop-filter:blur(10px) saturate(1.3);
    }
    .reset-card::after {
      content:""; position:absolute; left:0; right:0; bottom:0; height:5px;
      background:linear-gradient(90deg,var(--cyan),var(--yellow));
    }
    .brand { margin:0 0 8px; font-size:28px; font-weight:800; text-transform:uppercase; }
    .brand span { color:var(--orange); }
    .meta { margin:0 0 22px; color:var(--muted); font:500 10px/1.4 'DM Mono',monospace; letter-spacing:.17em; text-transform:uppercase; }
    h1 { margin:0; font-size:24px; line-height:1.08; text-transform:uppercase; }
    .rail { width:100%; height:5px; margin:14px 0 20px; background:linear-gradient(90deg,var(--cyan),var(--yellow)); }
    label { display:block; margin:14px 0 6px; color:var(--muted); font:500 10px/1.3 'DM Mono',monospace; letter-spacing:.13em; text-transform:uppercase; }
    input {
      width:100%; min-height:46px; padding:11px 12px; color:var(--text); font:600 15px/1.3 Inter,Arial,sans-serif;
      background:rgba(1,12,22,.84); border:1px solid rgba(119,239,250,.88); border-radius:3px;
      box-shadow:inset 0 1px 0 rgba(203,255,255,.18),inset 0 -2px 0 rgba(0,15,26,.64);
    }
    input:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--yellow); outline-offset:3px; }
    button, .back-link {
      display:flex; align-items:center; justify-content:center; width:100%; min-height:46px; margin-top:18px;
      border:1px solid rgba(119,239,250,.95); border-radius:3px; font:800 12px/1 Inter,Arial,sans-serif;
      letter-spacing:.08em; text-transform:uppercase; text-decoration:none;
    }
    button { background:#f5f7f4; color:#071112; cursor:pointer; box-shadow:0 3px 0 var(--deep); }
    button:disabled { opacity:.55; cursor:default; }
    .back-link { background:rgba(1,12,22,.84); color:var(--text); }
    .status { min-height:20px; margin-top:13px; color:var(--muted); font-size:13px; line-height:1.45; }
    .status.error { color:#ff8d73; }
    #reset-form[hidden], #invalid-link[hidden] { display:none; }
    @media (max-width:480px) { .reset-card { padding:22px 18px; } }
  </style>
</head>
<body>
  <main class="reset-card">
    <p class="brand">Class<span>Lingo</span></p>
    <p class="meta">Secure account recovery</p>
    <section id="checking">
      <h1>Checking reset link</h1>
      <div class="rail" aria-hidden="true"></div>
      <p class="status">Confirming the recovery session.</p>
    </section>
    <form id="reset-form" hidden>
      <h1>Choose a new password</h1>
      <div class="rail" aria-hidden="true"></div>
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="8" required />
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required />
      <button id="save-password" type="submit">Update password</button>
      <p class="status" id="reset-status" aria-live="polite"></p>
    </form>
    <section id="invalid-link" hidden>
      <h1>Reset link unavailable</h1>
      <div class="rail" aria-hidden="true"></div>
      <p class="status error" id="link-error">This reset link is invalid or expired. Request a new email from the admin sign-in.</p>
      <a class="back-link" href="/admin.html">Return to admin sign-in</a>
    </section>
  </main>
  <script>
    const cfg = window.CLASSLINGO_SUPABASE;
    const sb = window.supabase.createClient(cfg.url, cfg.anonKey);
    const checking = document.getElementById('checking');
    const form = document.getElementById('reset-form');
    const invalid = document.getElementById('invalid-link');
    const status = document.getElementById('reset-status');

    function showForm() {
      checking.hidden = true;
      invalid.hidden = true;
      form.hidden = false;
      document.getElementById('new-password').focus();
    }

    function showInvalid(message) {
      checking.hidden = true;
      form.hidden = true;
      invalid.hidden = false;
      if (message) document.getElementById('link-error').textContent = message;
    }

    const hash = new URLSearchParams(location.hash.slice(1));
    const query = new URLSearchParams(location.search);
    const authError = hash.get('error_description') || query.get('error_description');
    if (authError) showInvalid(decodeURIComponent(authError.replace(/\+/g, ' ')));

    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) showForm();
    });

    setTimeout(async () => {
      if (authError || !form.hidden) return;
      const { data } = await sb.auth.getSession();
      if (data.session) showForm();
      else showInvalid();
    }, 900);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;
      status.className = 'status';
      status.textContent = '';
      if (password.length < 8) {
        status.className = 'status error';
        status.textContent = 'Use at least 8 characters.';
        return;
      }
      if (password !== confirm) {
        status.className = 'status error';
        status.textContent = 'The passwords do not match.';
        return;
      }
      const button = document.getElementById('save-password');
      button.disabled = true;
      const { error } = await sb.auth.updateUser({ password });
      if (error) {
        button.disabled = false;
        status.className = 'status error';
        status.textContent = error.message;
        return;
      }
      status.textContent = 'Password updated. Returning to admin sign-in.';
      await sb.auth.signOut();
      location.replace('/admin.html?reset=complete');
    });
  </script>
</body>
</html>
